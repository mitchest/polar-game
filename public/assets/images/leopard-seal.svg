<svg xmlns="http://www.w3.org/2000/svg" width="96" height="44" viewBox="0 0 96 44">
  <defs>
    <linearGradient id="sealBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87949f"/>
      <stop offset="52%" stop-color="#67737f"/>
      <stop offset="100%" stop-color="#49545f"/>
    </linearGradient>
    <linearGradient id="sealBelly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8d3dc"/>
      <stop offset="100%" stop-color="#8fa0ad"/>
    </linearGradient>
  </defs>
  <!-- tail flippers -->
  <path d="M3 22 L15 12.4 L12.2 22 L15 31.6 Z" fill="#535d66" stroke="#3e4750" stroke-width="0.7"/>
  <!-- fore-flippers swept back from the front third -->
  <path d="M62 17 Q46 2.6 34.5 7 Q47 13.2 58 21 Z" fill="#596673" stroke="#3f4a54" stroke-width="0.6"/>
  <path d="M62 27 Q46 41.4 34.5 37 Q47 30.8 58 23 Z" fill="#596673" stroke="#3f4a54" stroke-width="0.6"/>
  <!-- long sinuous body -->
  <path d="M8.5 22 Q30 8.7 56 12.7 Q78 15.8 88.5 21 Q78 28.2 56 31.3 Q30 35.3 8.5 22 Z" fill="url(#sealBody)" stroke="#3d4650" stroke-width="0.8"/>
  <!-- lighter belly -->
  <ellipse cx="46.5" cy="24.8" rx="27.5" ry="6.8" fill="url(#sealBelly)" opacity="0.5"/>
  <path d="M17 22 Q40 28 70 24" stroke="#aebcc8" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.75"/>
  <!-- leopard spots -->
  <g fill="#35404a" opacity="0.95">
    <ellipse cx="26" cy="16.4" rx="2.2" ry="1.5"/>
    <ellipse cx="34" cy="19.5" rx="1.8" ry="1.3"/>
    <ellipse cx="42" cy="15" rx="2.7" ry="1.8"/>
    <ellipse cx="54" cy="16.2" rx="2.3" ry="1.6"/>
    <ellipse cx="38" cy="27" rx="2.5" ry="1.7"/>
    <ellipse cx="50" cy="28" rx="2.2" ry="1.5"/>
    <ellipse cx="24" cy="24" rx="2" ry="1.4"/>
    <ellipse cx="64" cy="20" rx="2.2" ry="1.5"/>
    <ellipse cx="59" cy="26.5" rx="1.7" ry="1.2"/>
    <ellipse cx="72" cy="23.2" rx="1.6" ry="1.1"/>
  </g>
  <!-- long leopard-seal head with a tapered muzzle -->
  <path d="M63.5 14 Q79.5 11.5 88.2 19.5 Q91.8 23.2 88.2 27.5 Q78.5 32.8 63.8 30.2 Q72 22.2 63.5 14 Z"
        fill="url(#sealBody)" stroke="#3d4650" stroke-width="0.8"/>
  <path d="M72 23.2 Q81.5 20 91.2 22.4 Q86.4 27.9 73.8 27.8 Q67.4 27.3 63.8 24.2 Q67.8 25.2 72 23.2 Z"
        fill="url(#sealBelly)" opacity="0.58"/>
  <path d="M76 18.2 Q84 17.8 89.5 21.2" stroke="#9fb0bd" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- angry open mouth, nostril and whisker pads -->
  <path d="M78 22.6 Q86 22.3 91.8 24.7 Q86.6 28.1 78.5 27.1 Q82 25 78 22.6 Z"
        fill="#6e1e2c" stroke="#4a101b" stroke-width="0.7"/>
  <path d="M80 23.2 L82 25.2 L84 23.3 L86 25.1 L88 23.7 L90 25.1" stroke="#f5f7f8" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M78.5 22.2 Q85.5 21.2 91.2 23.2" stroke="#2f3841" stroke-width="1.05" fill="none" stroke-linecap="round"/>
  <ellipse cx="86.8" cy="19.9" rx="1.75" ry="1.25" fill="#252d34"/>
  <circle cx="78.7" cy="21.2" r="0.55" fill="#2b333b"/>
  <circle cx="81.2" cy="20.5" r="0.55" fill="#2b333b"/>
  <circle cx="79.5" cy="25.2" r="0.55" fill="#2b333b"/>
  <circle cx="82.1" cy="25.7" r="0.55" fill="#2b333b"/>
  <!-- alert eye, less cartoon-snarl -->
  <path d="M65.6 13.2 Q72 11.3 75.8 14.2" stroke="#242c34" stroke-width="1.35" fill="none" stroke-linecap="round"/>
  <ellipse cx="70.4" cy="16.8" rx="2.6" ry="1.8" fill="#0d1218"/>
  <circle cx="71.2" cy="16.1" r="0.68" fill="#a7b6c1"/>
</svg>
