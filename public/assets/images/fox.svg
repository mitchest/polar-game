<svg xmlns="http://www.w3.org/2000/svg" width="46" height="52" viewBox="0 0 46 52">
  <defs>
    <radialGradient id="foxBody" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#f1f8fc"/>
      <stop offset="100%" stop-color="#bcd7e6"/>
    </radialGradient>
    <radialGradient id="foxTail" cx="50%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#eaf4fa"/>
      <stop offset="100%" stop-color="#a9cfe6"/>
    </radialGradient>
  </defs>
  <!-- bushy tail with white tip -->
  <ellipse cx="23" cy="43" rx="9" ry="11" fill="url(#foxTail)"/>
  <ellipse cx="23" cy="49" rx="5" ry="3.6" fill="#ffffff"/>
  <!-- hind legs -->
  <ellipse cx="13" cy="35" rx="4.5" ry="6" fill="#dbeaf4"/>
  <ellipse cx="33" cy="35" rx="4.5" ry="6" fill="#dbeaf4"/>
  <!-- body -->
  <ellipse cx="23" cy="29" rx="12" ry="15" fill="url(#foxBody)"/>
  <!-- front legs -->
  <ellipse cx="16" cy="20" rx="4" ry="5.5" fill="#e8f2f9"/>
  <ellipse cx="30" cy="20" rx="4" ry="5.5" fill="#e8f2f9"/>
  <!-- ears -->
  <path d="M15 8 L18.5 1.5 L22 11 Z" fill="#eaf4fa" stroke="#bcd7e6" stroke-width="0.8"/>
  <path d="M31 8 L27.5 1.5 L24 11 Z" fill="#eaf4fa" stroke="#bcd7e6" stroke-width="0.8"/>
  <path d="M16.5 8 L18.6 4 L20.4 9.5 Z" fill="#cfe6f4"/>
  <path d="M29.5 8 L27.4 4 L25.6 9.5 Z" fill="#cfe6f4"/>
  <!-- head -->
  <circle cx="23" cy="13" r="9" fill="url(#foxBody)"/>
  <!-- muzzle -->
  <path d="M19 15 Q23 21 27 15 Z" fill="#ffffff"/>
  <!-- eyes -->
  <circle cx="19.4" cy="12" r="1.6" fill="#3a4a55"/>
  <circle cx="26.6" cy="12" r="1.6" fill="#3a4a55"/>
  <!-- nose -->
  <circle cx="23" cy="16.5" r="1.8" fill="#39474f"/>
</svg>
