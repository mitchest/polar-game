<svg xmlns="http://www.w3.org/2000/svg" width="88" height="58" viewBox="0 0 88 58">
  <defs>
    <linearGradient id="ternWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfdee9"/>
      <stop offset="100%" stop-color="#9fb2c0"/>
    </linearGradient>
  </defs>
  <!-- deeply forked tail streamers -->
  <path d="M28 30 L5 23 L18 31 L7 41 Z" fill="#eef6fb" stroke="#c2d3df" stroke-width="0.5"/>
  <!-- far wing (behind the body), swept up -->
  <path d="M52 29 Q44 16 38 9 Q41 19 47 30 Z" fill="#a7b8c5" stroke="#889aa8" stroke-width="0.4"/>
  <!-- white streamlined body -->
  <path d="M26 31 Q40 24 56 25 Q66 25.5 72 30 Q66 36 48 37 Q34 37 26 31 Z" fill="#f4fafd" stroke="#c7d6e1" stroke-width="0.7"/>
  <!-- pale-grey mantle on the back -->
  <path d="M40 25.5 Q52 24 66 26 Q58 28 48 28 Q43 27.5 40 25.5 Z" fill="#cdd9e2" opacity="0.85"/>
  <!-- near wing (in front), long and pointed, swept up -->
  <path d="M56 28 Q44 14 30 5 Q34 18 44 29 Q50 30 56 28 Z" fill="url(#ternWing)" stroke="#95a8b6" stroke-width="0.6"/>
  <!-- darker primary feather tips -->
  <path d="M30 5 Q33 8 36 13 Q32 10 30 5 Z" fill="#8294a3"/>
  <path d="M44 29 Q40 20 33 9" stroke="#8fa3b2" stroke-width="0.7" fill="none" stroke-linecap="round"/>
  <!-- red legs, tucked and trailing -->
  <path d="M46 36 L42 41 M50 36 L47 41" stroke="#e0473a" stroke-width="1.3" stroke-linecap="round"/>
  <!-- black cap from forehead over the crown to the nape -->
  <path d="M60 27 Q70 17 79 25 Q75 27 69 27.5 Q63 27.5 60 27 Z" fill="#1b2026"/>
  <!-- bright red pointed bill -->
  <path d="M76 28.5 L86 31 L76 33 Z" fill="#e0473a" stroke="#b5392b" stroke-width="0.5"/>
  <path d="M76 31 L84 31" stroke="#8f2a20" stroke-width="0.5" stroke-linecap="round"/>
  <!-- eye just below the cap -->
  <circle cx="72" cy="29.6" r="1.5" fill="#10151a"/>
  <circle cx="72.4" cy="29.1" r="0.42" fill="#ffffff"/>
</svg>
