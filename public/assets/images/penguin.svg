<svg xmlns="http://www.w3.org/2000/svg" width="60" height="74" viewBox="0 0 60 74">
  <defs>
    <radialGradient id="penBack" cx="48%" cy="35%" r="68%">
      <stop offset="0%" stop-color="#454b54"/>
      <stop offset="68%" stop-color="#292e35"/>
      <stop offset="100%" stop-color="#14171c"/>
    </radialGradient>
    <linearGradient id="penWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8e8f1"/>
    </linearGradient>
  </defs>
  <!-- flippers swept back (mid-toboggan) -->
  <path d="M16.5 25.5 Q1 39 10.5 54 Q17.8 45.5 23.2 33 Z" fill="#22262c" stroke="#15191e" stroke-width="0.8"/>
  <path d="M43.5 25.5 Q59 39 49.5 54 Q42.2 45.5 36.8 33 Z" fill="#22262c" stroke="#15191e" stroke-width="0.8"/>
  <path d="M8.5 48 Q14 47 18 41 M51.5 48 Q46 47 42 41" stroke="#3b424b" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- webbed feet trailing behind -->
  <path d="M20.2 61.8 L15.7 71.5 L25.9 67.3 Z" fill="#f29a32" stroke="#c96919" stroke-width="0.6"/>
  <path d="M39.8 61.8 L44.3 71.5 L34.1 67.3 Z" fill="#f29a32" stroke="#c96919" stroke-width="0.6"/>
  <!-- short tail wedge -->
  <path d="M30 60 L25.6 70 L34.4 70 Z" fill="#15191e"/>
  <!-- black back -->
  <ellipse cx="30" cy="40" rx="17.4" ry="26.5" fill="url(#penBack)" stroke="#101419" stroke-width="0.8"/>
  <!-- white belly visible on the sliding body -->
  <ellipse cx="30" cy="42.5" rx="10.5" ry="18.6" fill="url(#penWhite)" opacity="0.92"/>
  <path d="M22 31 Q30 36 38 31" stroke="#d8e8f1" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="30" cy="16" r="11.2" fill="#22262c" stroke="#101419" stroke-width="0.8"/>
  <!-- gentoo white bonnet patch over the eyes / crown -->
  <path d="M21.7 13 Q30 6.7 38.3 13 Q34.5 14.7 30 14.7 Q25.5 14.7 21.7 13 Z" fill="#f4f9fd"/>
  <ellipse cx="24" cy="13.7" rx="3.6" ry="4.15" fill="#f4f9fd"/>
  <ellipse cx="36" cy="13.7" rx="3.6" ry="4.15" fill="#f4f9fd"/>
  <!-- eyes -->
  <circle cx="24" cy="14" r="1.75" fill="#10151a"/>
  <circle cx="36" cy="14" r="1.75" fill="#10151a"/>
  <circle cx="24.5" cy="13.5" r="0.45" fill="#ffffff"/>
  <circle cx="36.5" cy="13.5" r="0.45" fill="#ffffff"/>
  <!-- orange beak pointing forward -->
  <path d="M26.4 9 L30 0.8 L33.6 9 Z" fill="#f49a32" stroke="#cf721c" stroke-width="0.5"/>
  <path d="M30 0.8 L33.6 9 L30 9 Z" fill="#d9791d"/>
  <path d="M27.2 9.2 Q30 10.8 32.8 9.2" stroke="#b85f16" stroke-width="0.7" fill="none" stroke-linecap="round"/>
</svg>
