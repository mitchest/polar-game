<svg xmlns="http://www.w3.org/2000/svg" width="140" height="64" viewBox="0 0 140 64">
  <defs>
    <linearGradient id="albWingTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a646e"/>
      <stop offset="100%" stop-color="#39424b"/>
    </linearGradient>
    <linearGradient id="albBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe7ef"/>
    </linearGradient>
  </defs>
  <!-- far wing (behind the body), swept down and back -->
  <path d="M86 34 Q50 46 8 54 Q46 40 80 33 Z" fill="#46505a" stroke="#333b43" stroke-width="0.5"/>
  <!-- short tail wedge -->
  <path d="M30 35 L10 30 L22 36 L12 42 Z" fill="#cdd9e2"/>
  <!-- white body, long and gliding -->
  <path d="M26 35 Q46 30 72 31 Q100 31.5 118 35 Q104 41 72 41 Q46 41 26 35 Z" fill="url(#albBody)" stroke="#c2d0db" stroke-width="0.6"/>
  <!-- near wing (in front), long, swept up and back -->
  <path d="M90 33 Q54 20 14 9 Q30 18 52 27 Q72 34 86 35 Z" fill="url(#albWingTop)" stroke="#2f373f" stroke-width="0.6"/>
  <path d="M90 33 Q56 22 18 11" stroke="#aebcc7" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- head -->
  <circle cx="116" cy="33" r="6.6" fill="url(#albBody)" stroke="#c2d0db" stroke-width="0.5"/>
  <path d="M111 29 Q116 27 120 29 Q116 30 111 29 Z" fill="#cfd9e1" opacity="0.7"/>
  <!-- eye -->
  <circle cx="120" cy="32" r="1.5" fill="#1a1f24"/>
  <!-- big hooked pale bill with a tube nostril -->
  <path d="M120 30.5 L137 32.5 Q139.5 34 137 35.5 L120 36 Q123 33.3 120 30.5 Z" fill="#e9cd92" stroke="#c8a55f" stroke-width="0.6"/>
  <path d="M137 32.6 Q139.5 34 137 35.4" fill="none" stroke="#b58a44" stroke-width="0.8"/>
  <path d="M124 32.2 L130 32.8" stroke="#bf9a55" stroke-width="1.1" stroke-linecap="round"/>
</svg>
