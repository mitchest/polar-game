<svg xmlns="http://www.w3.org/2000/svg" width="180" height="160" viewBox="0 0 180 160">
  <defs>
    <radialGradient id="bearBody" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#fffdf4"/>
      <stop offset="64%" stop-color="#f4ecd8"/>
      <stop offset="100%" stop-color="#d8c7a4"/>
    </radialGradient>
  </defs>
  <!-- short tail (rump, away from play area) -->
  <circle cx="90" cy="24" r="9" fill="#f3ead4"/>
  <!-- back legs (upper) -->
  <ellipse cx="42" cy="60" rx="21" ry="27" fill="#ece0c6"/>
  <ellipse cx="138" cy="60" rx="21" ry="27" fill="#ece0c6"/>
  <ellipse cx="40" cy="74" rx="13" ry="11" fill="#e0d2b4"/>
  <ellipse cx="140" cy="74" rx="13" ry="11" fill="#e0d2b4"/>
  <!-- front legs (lower, toward play area) -->
  <ellipse cx="40" cy="120" rx="20" ry="25" fill="#efe4cc"/>
  <ellipse cx="140" cy="120" rx="20" ry="25" fill="#efe4cc"/>
  <ellipse cx="38" cy="136" rx="14" ry="11" fill="#e2d4b8"/>
  <ellipse cx="142" cy="136" rx="14" ry="11" fill="#e2d4b8"/>
  <!-- main body -->
  <ellipse cx="90" cy="82" rx="57" ry="62" fill="url(#bearBody)"/>
  <!-- shoulders / neck hump where the head attaches -->
  <ellipse cx="90" cy="130" rx="32" ry="25" fill="url(#bearBody)"/>
  <!-- soft fur shading down the back -->
  <ellipse cx="90" cy="70" rx="30" ry="40" fill="#fffdf4" opacity="0.5"/>
</svg>
