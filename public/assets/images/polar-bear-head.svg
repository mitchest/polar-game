<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bearHead" cx="43%" cy="43%" r="68%">
      <stop offset="0%" stop-color="#fffef6"/>
      <stop offset="64%" stop-color="#f2ead6"/>
      <stop offset="100%" stop-color="#d3bf96"/>
    </radialGradient>
    <linearGradient id="bearMuzzle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff8e9"/>
      <stop offset="100%" stop-color="#e7d5b4"/>
    </linearGradient>
  </defs>
  <!-- small ears set into the head outline -->
  <path d="M22 19 Q18 14 21 10 Q27 11 28 18 Z" fill="#f2ead6" stroke="#cdbb96" stroke-width="0.75"/>
  <path d="M22 45 Q18 50 21 54 Q27 53 28 46 Z" fill="#f2ead6" stroke="#cdbb96" stroke-width="0.75"/>
  <path d="M23 19 Q21 15 23 13" stroke="#d3b3a2" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M23 45 Q21 49 23 51" stroke="#d3b3a2" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- pear-shaped skull, narrow at rear so it tucks into the body -->
  <path d="M16 32
           Q20 18 34 16
           Q49 15 54 28
           Q57 36 50 43
           Q39 53 23 45
           Q17 41 16 32 Z"
        fill="url(#bearHead)" stroke="#cdbb96" stroke-width="0.9"/>
  <path d="M24 24 Q34 21 43 25 M24 40 Q34 43 43 39" stroke="#e1d3b5" stroke-width="1.05" fill="none" stroke-linecap="round"/>
  <!-- long polar bear muzzle pointing +x -->
  <path d="M40 24.8 Q58 26.4 59.2 32 Q58 37.6 40 39.2 Q47 32 40 24.8 Z"
        fill="url(#bearMuzzle)" stroke="#dac8a5" stroke-width="0.8"/>
  <path d="M47 32 Q51.5 34 56.8 32" stroke="#cab994" stroke-width="0.85" fill="none" stroke-linecap="round"/>
  <!-- nose and eyes -->
  <ellipse cx="57.2" cy="32" rx="4" ry="3.35" fill="#242424"/>
  <circle cx="55.9" cy="31.1" r="0.5" fill="#5b5b5b"/>
  <circle cx="58.2" cy="31.1" r="0.5" fill="#5b5b5b"/>
  <circle cx="42" cy="25.2" r="2.1" fill="#262626"/>
  <circle cx="42" cy="38.8" r="2.1" fill="#262626"/>
  <circle cx="42.6" cy="24.6" r="0.52" fill="#ffffff"/>
  <circle cx="42.6" cy="38.2" r="0.52" fill="#ffffff"/>
</svg>
