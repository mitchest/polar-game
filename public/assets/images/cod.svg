<svg xmlns="http://www.w3.org/2000/svg" width="48" height="24" viewBox="0 0 48 24">
  <defs>
    <linearGradient id="codBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c7a47"/>
      <stop offset="55%" stop-color="#a59f6d"/>
      <stop offset="100%" stop-color="#d8d2ac"/>
    </linearGradient>
  </defs>
  <!-- tail fin (slightly forked) -->
  <path d="M2 7 L12 12 L2 17 L5 12 Z" fill="#6f6d44"/>
  <!-- three dorsal fins along the back (cod hallmark) -->
  <path d="M13 5 Q16 1 19 5 Z" fill="#6f6d44"/>
  <path d="M21 5 Q24 1 27 5 Z" fill="#6f6d44"/>
  <path d="M29 5 Q32 2 34 6 Z" fill="#6f6d44"/>
  <!-- two anal fins along the belly -->
  <path d="M19 19 Q22 22 25 19 Z" fill="#6f6d44"/>
  <path d="M27 19 Q29 22 32 18 Z" fill="#6f6d44"/>
  <!-- body -->
  <ellipse cx="25" cy="12" rx="18" ry="7.6" fill="url(#codBody)"/>
  <!-- pale lateral line (curves up over the gill, distinctive of cod) -->
  <path d="M9 11 Q26 8.5 41 12" stroke="#ece6c4" stroke-width="1.3" fill="none"/>
  <!-- speckles on the back -->
  <ellipse cx="16" cy="9" rx="1.6" ry="1.1" fill="#5e5c38"/>
  <ellipse cx="23" cy="8.4" rx="1.7" ry="1.1" fill="#5e5c38"/>
  <ellipse cx="30" cy="9" rx="1.5" ry="1" fill="#5e5c38"/>
  <ellipse cx="20" cy="11" rx="1.3" ry="0.9" fill="#5e5c38"/>
  <!-- chin barbel -->
  <path d="M41 14 Q43 17 41.5 19.5" stroke="#6f6d44" stroke-width="1" fill="none"/>
  <!-- eye -->
  <circle cx="39" cy="10.2" r="1.9" fill="#1d1c12"/>
  <circle cx="39.5" cy="9.7" r="0.6" fill="#ffffff"/>
</svg>
