<svg xmlns="http://www.w3.org/2000/svg" width="48" height="24" viewBox="0 0 48 24">
  <defs>
    <linearGradient id="codBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f7041"/>
      <stop offset="52%" stop-color="#a69f6d"/>
      <stop offset="100%" stop-color="#ded8b5"/>
    </linearGradient>
    <linearGradient id="codFin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#777346"/>
      <stop offset="100%" stop-color="#56542f"/>
    </linearGradient>
  </defs>
  <!-- tail fin (slightly forked) -->
  <path d="M2 7 L12 12 L2 17 L5 12 Z" fill="url(#codFin)" stroke="#4d4b2d" stroke-width="0.5"/>
  <!-- three dorsal fins along the back (cod hallmark) -->
  <path d="M13 5 Q16 1 19 5 Z" fill="url(#codFin)"/>
  <path d="M21 5 Q24 1 27 5 Z" fill="url(#codFin)"/>
  <path d="M29 5 Q32 2 34 6 Z" fill="url(#codFin)"/>
  <!-- two anal fins along the belly -->
  <path d="M19 19 Q22 22 25 19 Z" fill="#6f6d44"/>
  <path d="M27 19 Q29 22 32 18 Z" fill="#6f6d44"/>
  <!-- body -->
  <ellipse cx="25" cy="12" rx="18.2" ry="7.8" fill="url(#codBody)" stroke="#56542f" stroke-width="0.7"/>
  <path d="M8 12 Q22 15.4 41 13" stroke="#6f6d44" stroke-width="0.75" fill="none" opacity="0.45"/>
  <!-- pale lateral line (curves up over the gill, distinctive of cod) -->
  <path d="M9 11 Q26 8.5 41 12" stroke="#efe9c7" stroke-width="1.35" fill="none"/>
  <path d="M35 7.2 Q33 12 35 17" stroke="#6b673d" stroke-width="0.85" fill="none" opacity="0.7"/>
  <!-- speckles on the back -->
  <g fill="#555331">
    <ellipse cx="15.2" cy="9" rx="1.5" ry="1"/>
    <ellipse cx="20" cy="11" rx="1.25" ry="0.85"/>
    <ellipse cx="23" cy="8.4" rx="1.7" ry="1.1"/>
    <ellipse cx="28" cy="11.5" rx="1.25" ry="0.85"/>
    <ellipse cx="30.5" cy="9" rx="1.5" ry="1"/>
  </g>
  <!-- chin barbel -->
  <path d="M41 14 Q43 17 41.5 19.5" stroke="#5c5a35" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="39" cy="10.2" r="2" fill="#1d1c12"/>
  <circle cx="39.6" cy="9.6" r="0.62" fill="#ffffff"/>
</svg>
